<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<title>shade</title>
<meta name="description" content="Snaps, Lenses, Stories und Spotlight – mit Familie und Freunden.">
<meta name="theme-color" content="#0d0e11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
*,*::before,*::after{box-sizing:border-box}
html{height:100%;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:#0d0e11;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{margin:0;font:14px system-ui,-apple-system,sans-serif;overscroll-behavior:none}
img{max-width:100%}
[hidden]{display:none!important}
input,textarea{font-size:16px}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800;900&family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: dunkle Handy-App auf voller Höhe – fünf Seiten zum Wischen (Chats · Stories · Kamera · Spotlight · Profil). Eine Akzentfarbe, die zum gewählten Logo passt. */
:root{
  --bg:#0d0e11; --surface:#17191e; --surface2:#20232a; --fg:#f2f3f5; --muted:#8b919d; --line:#262a31;
  --acc:#ffe14d; --acc-ink:#111214; --snap:#ff4d5e; --chat:#38b6ff; --flame:#ff8a3d; --like:#ff3b5c; --ok:#3ddc84;
  --display:"Archivo","Figtree",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
:root[data-theme="light"]{--bg:#f6f7f9; --surface:#ffffff; --surface2:#eceef2; --fg:#121317; --muted:#626977; --line:#e1e4ea; color-scheme:light}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
input,textarea{font:inherit}
svg.ic{width:var(--s,22px);height:var(--s,22px);flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.app{height:100%;display:grid;grid-template-rows:1fr auto;max-width:560px;margin:0 auto;position:relative}
.pager{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;min-height:0}
.pager::-webkit-scrollbar{display:none}
.panel{box-sizing:border-box;flex:0 0 100%;scroll-snap-align:start;scroll-snap-stop:always;overflow-y:auto;min-width:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.head{display:flex;align-items:center;gap:8px;padding-block:12px 10px}
.head h1{flex:1;text-align:center;font-family:var(--display);font-weight:800;font-size:21px;margin:0;letter-spacing:-.01em}
.round{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);flex:none}
.av{border-radius:50%;display:grid;place-items:center;flex:none;overflow:hidden;background-size:cover;background-position:center;font-family:var(--display);font-weight:800;color:#fff;letter-spacing:.02em}
.ring{box-shadow:0 0 0 2.5px var(--bg),0 0 0 5px var(--acc)}
.search{width:100%;box-sizing:border-box;padding:11px 14px 11px 40px;border-radius:12px;border:0;background:var(--surface2);color:var(--fg);margin-bottom:6px}
.searchwrap{position:relative}
.searchwrap svg{position:absolute;left:12px;top:11px;color:var(--muted);--s:19px}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.row .t{flex:1;min-width:0}
.row b{display:block;font-weight:700}
.row small{display:flex;align-items:center;gap:6px;color:var(--muted);white-space:nowrap;overflow:hidden;font-size:13.5px}
.row small span{overflow:hidden;text-overflow:ellipsis}
.row small.new{color:var(--snap);font-weight:800}
.row small.newchat{color:var(--chat);font-weight:800}
.sq{width:11px;height:11px;border-radius:3px;flex:none;background:currentColor}
.sq.o{background:none;border:2px solid currentColor;box-sizing:border-box}
.flame{display:inline-flex;align-items:center;gap:3px;color:var(--flame);font-weight:800;font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}
.flame svg{--s:15px;fill:currentColor;stroke:none}
.logo{width:84px;height:84px;border-radius:24px;display:grid;place-items:center;box-shadow:0 10px 30px #0006;flex:none;box-sizing:border-box}
.logo svg{width:88%;height:88%}
h2{font-family:var(--display);font-weight:800;font-size:17px;margin:18px 0 10px;display:flex;justify-content:space-between;align-items:baseline;letter-spacing:-.01em}
h2 small{font-family:var(--body);font-size:12.5px;color:var(--muted);font-weight:600}
.note{font-size:12.5px;color:var(--muted);text-align:center;padding:4px 0 10px;margin:0}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;background:var(--acc);color:var(--acc-ink);padding:4px 9px;border-radius:8px}
.pill.dim{background:var(--surface2);color:var(--fg)}
.verified{color:var(--chat);display:inline-grid;vertical-align:-2px;margin-left:4px}
.verified svg{--s:16px;fill:currentColor;stroke:var(--bg);stroke-width:1.5}
/* Kamera */
.cam{padding:0;background:#000;color:#fff;display:flex;flex-direction:column}
.viewfinder{flex:1;margin:8px max(10px,env(safe-area-inset-right,0px)) 0 max(10px,env(safe-area-inset-left,0px));border-radius:24px;background:#111 center/cover;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px;position:relative;min-height:0;overflow:hidden}
.viewfinder::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0008,transparent 25%,transparent 70%,#000a)}
.viewfinder>*{position:relative;z-index:1}
.viewfinder p{margin:0;opacity:.85;max-width:30ch;font-weight:600}
.camtop{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:8px;z-index:2}
.camside{position:absolute;right:12px;top:64px;display:grid;gap:10px;z-index:2}
.glass{background:#0000004d;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#fff}
.lensrow{display:flex;gap:10px;overflow-x:auto;padding:12px max(16px,env(safe-area-inset-left,0px)) 6px;scrollbar-width:none;align-items:center}
.lensrow::-webkit-scrollbar{display:none}
.lens{flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:24px;background:#ffffff1a center/cover;position:relative;box-sizing:border-box;border:2px solid #ffffff26}
.lens[aria-pressed="true"]{border:3px solid var(--acc)}
.shoot{width:78px;height:78px;border-radius:50%;border:5px solid #fff;background:#ffffff26;display:grid;place-items:center;font-size:28px}
.lensname{text-align:center;font-size:12.5px;font-weight:800;min-height:18px;letter-spacing:.04em;text-transform:uppercase;opacity:.85}
.camrow{display:flex;align-items:center;justify-content:space-between;padding:6px max(28px,env(safe-area-inset-left,0px)) 8px}
.camrow .round{width:46px;height:46px}
/* Stories */
.mine{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 14px}
.circles{display:flex;gap:14px;overflow-x:auto;padding:12px 2px 4px;scrollbar-width:none}
.circles button{display:grid;justify-items:center;gap:6px;font-size:12.5px;font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding-bottom:20px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}
.card{position:relative;aspect-ratio:3/4;border-radius:14px;overflow:hidden;max-width:100%;text-align:left;color:#fff;background:#111}
.card .art{position:absolute;inset:0}
.card .cap{position:absolute;left:0;right:0;bottom:0;padding:10px;background:linear-gradient(transparent,#000c);display:flex;align-items:center;gap:8px;font-weight:700;font-size:13.5px}
.card.unseen{box-shadow:inset 0 0 0 3px var(--acc)}
.tile{position:relative;aspect-ratio:3/4;overflow:hidden;color:#fff;border-radius:4px;background:#111;display:block}
.tile small{position:absolute;left:6px;bottom:5px;font-size:11.5px;font-weight:800;text-shadow:0 1px 4px #000;display:flex;align-items:center;gap:3px}
.tile small svg{--s:13px}
/* Leiste */
.tabs{display:flex;justify-content:space-around;padding:8px max(8px,env(safe-area-inset-right,0px)) 6px max(8px,env(safe-area-inset-left,0px));border-top:1px solid var(--line);background:var(--bg)}
.tabs button{display:grid;justify-items:center;gap:3px;font-size:10.5px;font-weight:700;color:var(--muted);flex:1;position:relative;min-width:0}
.tabs button svg{--s:24px}
.tabs button[aria-current="true"]{color:var(--fg)}
.tabs button[aria-current="true"] svg{color:var(--acc)}
.badge{position:absolute;top:-4px;right:calc(50% - 22px);background:var(--snap);color:#fff;font-size:10.5px;border-radius:10px;padding:0 5px;font-weight:800}
/* Overlays */
.ov{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);max-width:560px;margin:0 auto}
.ov.dark{background:#000;color:#fff}
.ov.dim{background:#000a;max-width:none}
.chathead{display:flex;align-items:center;gap:10px;padding:8px max(12px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.msgs{flex:1;overflow-y:auto;padding:10px max(14px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:4px}
.b{max-width:78%;padding:8px 13px;border-radius:18px;line-height:1.35;overflow-wrap:anywhere}
.b.me{align-self:flex-end;background:var(--chat);color:#fff;border-bottom-right-radius:6px}
.b.in{align-self:flex-start;background:var(--surface2);border-bottom-left-radius:6px}
.b time{display:block;font-size:11px;opacity:.65;margin-top:2px}
.who{font-size:12px;font-weight:800;margin:8px 0 0 6px}
.snaptile{align-self:flex-start;display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:14px;font-weight:800;border:1.5px solid var(--snap);color:var(--snap)}
.snaptile.wait{background:var(--snap);color:#fff}
.snaptile.me{align-self:flex-end}
.sharecard{display:flex;gap:10px;align-items:center;padding:8px;border-radius:16px;background:var(--surface2);max-width:78%;text-align:left}
.sharecard.me{align-self:flex-end}
.sharecard .mini{width:46px;height:62px;border-radius:8px;flex:none;position:relative;overflow:hidden}
.compose{display:flex;gap:8px;align-items:center;padding:8px max(12px,env(safe-area-inset-left,0px));border-top:1px solid var(--line)}
.compose input{flex:1;min-width:0;padding:11px 14px;border-radius:20px;border:0;background:var(--surface2);color:var(--fg)}
.abtn{width:42px;height:42px;border-radius:50%;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;flex:none}
.stage{flex:1;position:relative;display:grid;place-items:center;min-height:0;padding:0 12px}
/* Snap-Bild mit Ebenen */
.shot{width:min(100%,calc((100dvh - 270px)*0.5625));aspect-ratio:9/16;border-radius:16px;position:relative;overflow:hidden;display:grid;place-items:center;max-width:100%;container-type:inline-size;user-select:none;-webkit-user-select:none;touch-action:none;background:#111}
.shot.small{width:100%;border-radius:0}
.shot>.photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
.shot .capbar{position:absolute;left:0;right:0;background:#000000a6;color:#fff;font-size:5.6cqw;font-weight:700;text-align:center;padding:2.2cqw 3cqw;font-family:var(--body);transform:translateY(-50%)}
.shot .stamp{position:absolute;left:6cqw;bottom:8cqw;color:#fff;text-align:left;font-family:var(--display);line-height:1;text-shadow:0 2px 12px #0009}
.shot .stamp .tm{font-size:16cqw;font-weight:900;display:block;letter-spacing:-.02em}
.shot .stamp .pl{font-size:5.6cqw;font-weight:700;display:flex;gap:1.5cqw;align-items:center;margin-top:2cqw;text-transform:uppercase;letter-spacing:.12em}
.shot .stamp .pl svg{width:5cqw;height:5cqw}
.shot .stamp.boxed{background:#fff;color:#111;text-shadow:none;padding:3.5cqw 4.5cqw;border-radius:3cqw}
.card .shot .stamp,.post .shot .stamp{bottom:auto;top:18cqw}
.card .shot .capbar{display:none}
.toast[hidden]{display:none}
.shot .stk{position:absolute;transform:translate(-50%,-50%);line-height:1;cursor:grab}
.shot .stk.sel{outline:2px dashed #fff;outline-offset:4px;border-radius:8px}
.shot .rain{position:absolute;inset:0;pointer-events:none}
.shot .rain span{position:absolute;line-height:1}
.shot .frame{position:absolute;inset:3.5cqw;pointer-events:none;border:.8cqw solid #fffc;border-radius:2cqw}
.shot .tint{position:absolute;inset:0;pointer-events:none;mix-blend-mode:overlay}
.shot .grain{position:absolute;inset:0;pointer-events:none;opacity:.18;background-image:repeating-linear-gradient(0deg,#fff1 0 1px,transparent 1px 3px)}
.tools{display:flex;gap:8px;overflow-x:auto;padding:6px max(16px,env(safe-area-inset-left,0px));scrollbar-width:none;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:20px;background:#ffffff1f;color:#fff;font-weight:700;white-space:nowrap;font-size:13.5px}
.chip svg{--s:16px}
.chip[aria-pressed="true"]{background:#fff;color:#000}
.emo{font-size:28px;padding:2px 4px}
.edbar{display:flex;gap:10px;padding:6px max(16px,env(safe-area-inset-left,0px)) 12px;align-items:center}
.tools input{flex:1;min-width:0;padding:10px 14px;border-radius:20px;border:0;background:#ffffff1f;color:#fff}
.send{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:24px;background:var(--acc);color:var(--acc-ink);font-weight:800;white-space:nowrap}
.send svg{--s:18px}
.send[disabled]{opacity:.45}
.sbtn{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:12px;background:var(--surface2);font-weight:700;font-size:13.5px;color:var(--fg)}
.sbtn svg{--s:17px}
.sheet{position:fixed;inset:auto 0 0 0;z-index:30;background:var(--surface);border-radius:20px 20px 0 0;max-height:85%;overflow-y:auto;box-shadow:0 -10px 40px #0008;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));max-width:560px;margin:0 auto;color:var(--fg);box-sizing:border-box}
.sheet.tall{height:72%;display:flex;flex-direction:column}
.sheet h2:first-child{margin-top:0}
.pick{display:flex;align-items:center;gap:12px;padding:9px 0;width:100%;text-align:left;border-bottom:1px solid var(--line)}
.pick .t{flex:1;font-weight:700;min-width:0}
.pick .t small{display:block;color:var(--muted);font-weight:500}
.check{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:var(--acc-ink);flex:none}
.check svg{--s:14px;stroke-width:3}
.pick[aria-pressed="true"] .check{background:var(--acc);border-color:var(--acc)}
.bars{display:flex;gap:4px;padding:10px 10px 6px}
.bars i{flex:1;height:3px;border-radius:2px;background:#ffffff55;overflow:hidden}
.bars i b{display:block;height:100%;background:#fff;width:0}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:60;background:#fff;color:#111;padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;box-shadow:0 6px 24px #0007;max-width:90%;display:flex;gap:8px;align-items:center}
/* Anmeldung */
.auth{position:fixed;inset:0;z-index:40;background:radial-gradient(120% 60% at 50% 0%,color-mix(in srgb,var(--acc) 22%,#0d0e11),#0d0e11 70%);color:#fff;overflow-y:auto;padding:calc(36px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.auth .inner{max-width:420px;margin:0 auto;display:grid;gap:18px}
.auth .brand{display:grid;justify-items:center;gap:10px;text-align:center}
.auth h1{font-family:var(--display);font-weight:900;font-size:40px;margin:0;letter-spacing:-.02em}
.auth .tag{color:#b9bec8;font-weight:600}
.auth .card2{background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:20px;padding:20px;display:grid;gap:12px}
.field{display:grid;gap:5px}
.field label{font-size:12.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.field input,.field textarea{padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface2);color:var(--fg);resize:none}
.err{color:var(--snap);font-weight:700;font-size:13.5px;margin:0}
.big{padding:14px;border-radius:14px;background:var(--acc);color:var(--acc-ink);font-weight:800;font-size:16px;width:100%}
.link{color:var(--chat);font-weight:700;text-align:center;width:100%;padding:6px}
.photopick{display:flex;align-items:center;gap:14px}
.pbtns{display:flex;flex-wrap:wrap;gap:8px}
/* Spotlight */
.spot{padding:0;position:relative;background:#000;color:#fff}
.feed{height:100%;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;overscroll-behavior:contain}
.feed::-webkit-scrollbar{display:none}
.ov .feed{flex:1;height:auto}
.post{height:100%;scroll-snap-align:start;scroll-snap-stop:always;position:relative;overflow:hidden;user-select:none;-webkit-user-select:none;background:#000}
.post .art{position:absolute;inset:0}
.post::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0006,transparent 18%,transparent 62%,#000b);pointer-events:none}
.post .info{position:absolute;left:14px;right:80px;bottom:18px;color:#fff;font-size:14.5px;display:grid;gap:7px;z-index:1}
.post .creator{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15.5px;text-align:left;color:#fff}
.post .follow{font-size:12.5px;padding:5px 11px;border-radius:8px;border:1.5px solid #fff;font-weight:800;color:#fff}
.post .follow.on{background:#fff;color:#000}
.post .sound{font-size:12.5px;opacity:.85;display:flex;gap:6px;align-items:center}
.post .sound svg{--s:14px}
.post .side{position:absolute;right:8px;bottom:22px;display:grid;gap:18px;justify-items:center;color:#fff;z-index:1}
.post .side button{display:grid;justify-items:center;gap:3px;color:#fff}
.post .side button svg{--s:30px;filter:drop-shadow(0 1px 4px #0008)}
.post .side button small{font-size:12px;font-weight:800;font-variant-numeric:tabular-nums}
.post .side .on svg{fill:var(--like);stroke:var(--like)}
.post .side .saved svg{fill:#fff}
.post .burst{position:absolute;pointer-events:none;color:var(--like);z-index:2;animation:burst .8s ease-out forwards}
.post .burst svg{--s:110px;fill:currentColor;stroke:none;filter:drop-shadow(0 4px 20px #0008)}
.post .vbar{position:absolute;left:0;right:0;bottom:0;height:3px;background:#ffffff33;z-index:2}
.post .vbar i{display:block;height:100%;width:0;background:#fff}
.post .snd{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:76px;height:76px;border-radius:50%;background:#0008;display:grid;place-items:center;color:#fff;z-index:2;opacity:0;transition:opacity .25s;pointer-events:none}
.post .snd.show{opacity:1}
.post .snd svg{--s:34px}
.post .demo{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:6px;background:#ffffff26}
.modes{display:flex;justify-content:center;gap:18px;font-size:13px;font-weight:800;letter-spacing:.08em;padding-top:4px}
.modes button{opacity:.55;padding:4px 2px}
.modes button[aria-pressed="true"]{opacity:1;color:var(--acc);border-bottom:2px solid var(--acc)}
.shoot.vid::after{content:"";width:28px;height:28px;border-radius:50%;background:#ff3b30}
@keyframes burst{0%{transform:scale(.3);opacity:0}25%{transform:scale(1.15);opacity:1}100%{transform:scale(1) translateY(-60px);opacity:0}}
.spottop{position:absolute;top:0;left:0;right:0;z-index:3;display:flex;justify-content:space-between;align-items:center;padding:12px 14px;color:#fff;font-family:var(--display);font-weight:800;font-size:20px;pointer-events:none}
.spottop button{pointer-events:auto}
.seg{display:flex;gap:16px;font-family:var(--body);font-size:15px;font-weight:700}
.seg span{opacity:.6} .seg span.on{opacity:1;border-bottom:2px solid #fff;padding-bottom:2px}
/* Kommentare */
.comments{flex:1;overflow-y:auto;display:grid;align-content:start;gap:16px;padding:6px 0}
.cmt{display:flex;gap:10px;align-items:flex-start}
.cmt .t{flex:1;min-width:0;font-size:14px;line-height:1.4;overflow-wrap:anywhere}
.cmt .t b{font-size:13px;color:var(--muted)}
.cmt .t small{display:block;color:var(--muted);font-size:12px;margin-top:3px}
.cmt .lk{font-size:12px;color:var(--muted);display:grid;justify-items:center;gap:2px}
.cmt .lk svg{--s:17px}
.cmt .lk.on{color:var(--like)} .cmt .lk.on svg{fill:currentColor}
/* Profil */
.prof{padding:0}
.banner{height:160px;position:relative;overflow:hidden;background:#15171c center/cover}
.banner::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0004,var(--bg))}
.banner .bg{position:absolute;inset:-30px;background-size:cover;background-position:center;filter:blur(22px) saturate(1.2);opacity:.9}
.banner .tools2{position:absolute;z-index:1;top:10px;right:max(12px,env(safe-area-inset-right,0px));left:max(12px,env(safe-area-inset-left,0px));display:flex;justify-content:space-between}
.pbody{padding:0 max(16px,env(safe-area-inset-right,0px)) 28px max(16px,env(safe-area-inset-left,0px));margin-top:-62px;position:relative}
.bigav{border:4px solid var(--bg);box-sizing:content-box}
.pname{font-family:var(--display);font-weight:900;font-size:28px;margin:10px 0 0;line-height:1.1;letter-spacing:-.02em;text-wrap:balance}
.puser{color:var(--muted);font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:3px}
.bio{margin:10px 0 0;line-height:1.5;max-width:60ch;white-space:pre-wrap}
.stats{display:grid;grid-template-columns:repeat(4,1fr);margin:16px 0;text-align:center;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
.stats div{padding:12px 4px}
.stats div+div{border-left:1px solid var(--line)}
.stats b{display:block;font-family:var(--display);font-weight:800;font-size:19px;font-variant-numeric:tabular-nums}
.stats small{font-size:11.5px;color:var(--muted);font-weight:700}
.pactions{display:flex;gap:8px}
.pactions button{flex:1;display:inline-flex;justify-content:center;align-items:center;gap:7px;padding:11px;border-radius:12px;font-weight:800;background:var(--surface2)}
.pactions button svg{--s:18px}
.pactions .main{background:var(--acc);color:var(--acc-ink)}
.ptabs{display:flex;margin:18px 0 10px;border-bottom:1px solid var(--line)}
.ptabs button{flex:1;display:grid;justify-items:center;gap:3px;padding:10px 4px;font-weight:700;font-size:12.5px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.ptabs button[aria-current="true"]{color:var(--fg);border-color:var(--fg)}
.trophies{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.trophy{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 8px;text-align:center;display:grid;gap:6px;justify-items:center}
.trophy .tic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--acc);color:var(--acc-ink)}
.trophy b{font-size:12.5px}
.trophy small{font-size:11px;color:var(--muted);font-weight:600}
.trophy.locked .tic{background:var(--surface2);color:var(--muted)}
.trophy.locked b{color:var(--muted)}
.score{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-top:14px}
.score .lv{width:44px;height:44px;border-radius:12px;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:18px;flex:none}
.score .meter{height:6px;border-radius:6px;background:var(--surface2);overflow:hidden}
.score .meter i{display:block;height:100%;background:var(--acc);border-radius:6px}
.friendsrow{display:flex;gap:14px;overflow-x:auto;padding:4px 0 6px;scrollbar-width:none}
.friendsrow button{display:grid;justify-items:center;gap:4px;font-size:12px;font-weight:700}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:22px;text-align:center;color:var(--muted);font-weight:600}
.logopick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.logopick button{display:grid;justify-items:center;gap:6px;padding:10px 4px;border-radius:14px;border:2px solid transparent;font-size:12.5px;font-weight:700}
.logopick button[aria-pressed="true"]{border-color:var(--acc);background:var(--surface2)}
.steps{display:grid;gap:12px;margin:6px 0 14px;padding:0;list-style:none;counter-reset:st}
.steps li{display:flex;gap:12px;align-items:center;background:var(--surface2);border-radius:14px;padding:12px 14px;font-weight:600;line-height:1.35}
.steps li::before{counter-increment:st;content:counter(st);flex:none;width:28px;height:28px;border-radius:50%;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;font-weight:900}
.steps .k{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:8px;background:var(--bg);font-weight:800;white-space:nowrap}
.steps .k svg{--s:16px}
.installbar{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 12px;margin:4px 0 10px}
.installbar b{display:block;font-size:14px}
.installbar small{color:var(--muted);font-size:12.5px}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important;transition:none!important}}

      if (square){ const s = Math.min(sw, sh); sx = (sw - s)/2; sy = (sh - s)/2; sw = sh = s; }
      const scale = Math.min(1, max / Math.max(sw, sh));

function rainSpots(seedChar){
  let s = [...seedChar].reduce((a,c)=>a+c.codePointAt(0),7);
  const rnd = () => (s = (s*9301+49297)%233280)/233280;
  return Array.from({length:14},()=>({x:rnd()*94, y:rnd()*94, size:6+rnd()*8, r:Math.round(rnd()*50-25)}));
}
function renderShot(snap, opts={}){
  const el = h("div",{class:"shot"+(opts.small?" small":"")});
  if (snap.video){
    const v = h("video",{class:"photo",src:snap.video+(opts.thumb?"#t=0.5":""),playsinline:true,preload:opts.thumb?"metadata":"auto",style:`filter:${snap.filter||"none"}`});
    v.muted = !opts.sound; v.playsInline = true;
    if (!opts.thumb && !opts.manual){ v.loop = !opts.once; v.autoplay = true; v.setAttribute("autoplay",""); }
    if (opts.manual) v.loop = true;
    el.append(v);
  } else el.append(h("img",{class:"photo",src:snap.img,alt:"",style:`filter:${snap.filter||"none"}`}));
  if (snap.tint) el.append(h("div",{class:"tint",style:`background:${snap.tint}`}));
  if (snap.grain) el.append(h("div",{class:"grain"}));
  if (snap.rain){ const r = h("div",{class:"rain"}); rainSpots(snap.rain).forEach(p=>r.append(h("span",{style:`left:${p.x}%;top:${p.y}%;font-size:${p.size}cqw;transform:rotate(${p.r}deg)`},snap.rain))); el.append(r); }
  if (snap.frame) el.append(h("div",{class:"frame"}));
  (snap.stickers||[]).forEach((st,i)=>{
    const s = h("span",{class:"stk"+(opts.selected===i?" sel":""),style:`left:${st.x}%;top:${st.y}%;font-size:${st.s}cqw`}, st.e);
    if (opts.onDrag) makeDraggable(s, el, st, ()=>opts.onDrag(i));
    el.append(s);
  });
  if (snap.stamp) el.append(h("div",{class:"stamp"+(snap.stamp.style==="boxed"?" boxed":"")}, h("span",{class:"tm"}, snap.stamp.time), snap.stamp.place ? h("span",{class:"pl"}, ic("pin"), snap.stamp.place) : null));
  if (snap.cap) el.append(h("div",{class:"capbar",style:`top:${snap.capY||64}%`}, snap.cap));
  return el;
}
function makeDraggable(node, box, st, done){
  node.addEventListener("pointerdown", e => {
    e.preventDefault(); e.stopPropagation(); node.setPointerCapture(e.pointerId);
    const r = box.getBoundingClientRect();
    const move = ev => { st.x = Math.min(96,Math.max(4,(ev.clientX-r.left)/r.width*100)); st.y = Math.min(96,Math.max(4,(ev.clientY-r.top)/r.height*100)); node.style.left = st.x+"%"; node.style.top = st.y+"%"; };
    const up = () => { node.removeEventListener("pointermove",move); node.removeEventListener("pointerup",up); done(); };
    node.addEventListener("pointermove",move); node.addEventListener("pointerup",up);
  });
}
function miniShot(snap, cls, label, opts){
  const t = h("div",{class:cls||"tile"});
  const s = renderShot(snap,{small:true, thumb:true, ...(opts||{})}); s.style.cssText += ";position:absolute;inset:0;height:100%;aspect-ratio:auto";

async function changePhoto(){

// ================= Zum Home-Bildschirm =================
let installEvt = null;
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; });
const isInstalled = () => { try { return window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true; } catch { return false; } };
const isApple = /iPhone|iPad|iPod|Macintosh/.test(navigator.userAgent) && !/Android/.test(navigator.userAgent);
async function goFullscreen(){
  const el = document.documentElement;
  const req = el.requestFullscreen || el.webkitRequestFullscreen;
  if (document.fullscreenElement || document.webkitFullscreenElement){ (document.exitFullscreen||document.webkitExitFullscreen).call(document); return; }
  try { if (!req) throw 0; await req.call(el); }
  catch { openInstall(true); }
}
function openInstall(fromFullscreen){
  const k = (icon, text) => h("span",{class:"k"}, icon ? ic(icon) : null, text);
  const steps = isApple
    ? [ ["Tippe in Safari unten auf ", k("more",""), " – oder auf ", k("shareios","Teilen"), "."],
        ["Tippe auf ", k(null,"Zum Home-Bildschirm"), ". Falls du es nicht siehst: im Menü nach unten wischen."],
        ["Tippe oben rechts auf ", k(null,"Hinzufügen"), ". Fertig – shade ist jetzt auf deinem Home-Bildschirm."] ]
    : [ ["Tippe im Browser oben rechts auf ", k("more",""), "."],
        ["Tippe auf ", k(null,"App installieren"), " oder ", k(null,"Zum Startbildschirm"), "."],
        ["Bestätige mit ", k(null,"Installieren"), "."] ];
  overlay.replaceChildren(h("div",{class:"ov dim",onclick:e=>{ if(e.target===e.currentTarget) closeOverlay(); }},
    h("div",{class:"sheet"},
      h("h2",{},"shade als App", iconBtn("close","Schließen",closeOverlay)),
      fromFullscreen === true ? h("p",{class:"empty",style:"margin:0 0 12px;text-align:left"},"Dieses Gerät erlaubt kein Vollbild per Knopf. Auf dem iPhone geht Vollbild nur über den Home-Bildschirm:") : h("button",{class:"send",style:"width:100%;margin-bottom:12px",onclick:()=>{ closeOverlay(); goFullscreen(); }}, ic("expand"),"Vollbild jetzt"),
      h("div",{style:"display:flex;gap:14px;align-items:center;margin-bottom:12px"}, logo(60), h("span",{}, h("b",{style:"display:block;font-size:17px"},"shade auf deinen Home-Bildschirm"), h("small",{style:"color:var(--muted)"},"Startet im Vollbild wie eine echte App."))),
      isInstalled() ? h("p",{class:"empty"},"shade ist schon als App installiert.") : null,
      installEvt ? h("button",{class:"send",style:"width:100%;margin-bottom:12px",onclick:async()=>{ installEvt.prompt(); const r = await installEvt.userChoice; installEvt = null; if (r.outcome==="accepted"){ closeOverlay(); toast("shade wird installiert"); } }}, ic("home"),"Jetzt installieren") : null,
      h("ol",{class:"steps"}, ...steps.map(st=>h("li",{}, h("span",{}, ...st)))),
      isApple ? h("p",{class:"note",style:"text-align:left"},"Wichtig: Das klappt nur in Safari. Wenn du shade gerade in einer anderen App geöffnet hast, öffne den Link zuerst in Safari.") : null,
      h("button",{class:"sbtn",style:"width:100%;justify-content:center",onclick:closeOverlay},"Verstanden"))));
}

// ================= Navigation =================
const pager = document.getElementById("pager");
const TABS = [["chat","Chats"],["users","Stories"],["camera","Kamera"],["play","Spotlight"],["user","Profil"]];
document.getElementById("tabs").replaceChildren(...TABS.map(([i,l],k)=>h("button",{"data-i":k,"aria-label":l}, ic(i), l, k===0?h("span",{class:"badge",id:"badge",hidden:true}):null)));
const tabBtns = [...document.querySelectorAll("#tabs button")];
let curTab = 2;
function setTab(i){ curTab=i; tabBtns.forEach((b,j)=>b.setAttribute("aria-current", i===j ? "true" : "false")); }
function goTab(i){ if (overlay.childElementCount) closeOverlay(); pager.scrollTo({left:i*pager.clientWidth,behavior:"smooth"}); setTab(i); }
tabBtns.forEach(b=>b.addEventListener("click",()=>goTab(+b.dataset.i)));
pager.addEventListener("scroll",()=>setTab(Math.round(pager.scrollLeft/pager.clientWidth)),{passive:true});
window.addEventListener("resize",()=>{ pager.scrollLeft = curTab*pager.clientWidth; });

function renderAll(){ renderChats(); renderStories(); renderCam(); renderSpot(); renderProfile(); }

applyLogo();
const savedTheme = store.get("pling-theme"); if (savedTheme === "light") document.documentElement.setAttribute("data-theme","light");
if (!loggedIn) showAuth(); else renderAll();
requestAnimationFrame(()=>{ pager.scrollLeft = 2*pager.clientWidth; setTab(2); });
setInterval(()=>{ if(!overlay.childElementCount && loggedIn) { renderChats(); renderStories(); } }, 60000);
</script>
